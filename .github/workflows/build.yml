name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Keystore
        env: { KS: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/ars.jks; echo "KEYSTORE_PATH=$RUNNER_TEMP/ars.jks" >> $GITHUB_ENV; fi
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: arsnova
        run: gradle assembleRelease --no-daemon --stacktrace && mv app/build/outputs/apk/release/app-release.apk ArsNova-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: ArsNova-apk, path: "ArsNova-*.apk" }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "v0.1.${{ github.run_number }}", name: "ArsNova 0.1.${{ github.run_number }}", files: "ArsNova-*.apk" }
